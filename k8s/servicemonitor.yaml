apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flight-delay-api
  namespace: monitoring
  labels:
    release: monitoring

spec:
  namespaceSelector:
    matchNames:
      - default

  selector:
    matchLabels:
      app: flight-delay-api

  endpoints:
    - port: http
      path: /metrics
      interval: 5s
